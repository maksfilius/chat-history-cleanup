name: Deploy landing and privacy policy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "pages/**"
      - "landing/**"
      - "src/**"
      - "public/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build interactive demo
        run: npm run build:landing

      - name: Stage site
        run: |
          mkdir -p _site/demo
          cp -R pages/. _site/
          rm _site/README.md
          cp landing/index.html landing/styles.css landing/demo.js _site/demo/
          cp -R landing/icons landing/branding _site/demo/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
