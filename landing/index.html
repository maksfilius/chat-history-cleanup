<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#202222">
  <meta name="description" content="A little less chat history. A lot more headspace. Try Chat Cleanup in an interactive demo workspace.">
  <title>Chat Cleanup — Make room for what’s next.</title>
  <link rel="icon" type="image/png" sizes="16x16" href="icons/icon16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon32.png">
  <link rel="icon" type="image/svg+xml" href="branding/logo.svg">
  <link rel="apple-touch-icon" sizes="128x128" href="icons/icon128.png">
  <link rel="stylesheet" href="styles.css">
  <script src="demo.js" defer></script>
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <!-- chat-cleanup-logo:start -->
    <symbol id="chat-cleanup-logo" viewBox="0 0 128 128"><!-- Chat Cleanup mark, built from primitives: two identical bubbles — a 68x40 rounded
       rectangle (r=12) plus a tail wedge — offset by exactly (+34,+32), each carrying two pill
       text bars, plus two four-point sparkles. Each bubble is drawn as an off-white keyline
       first, then as itself, so the keyline lands only outside the union of body and tail.
       The keyline holds the charcoal bubble against dark backgrounds and is invisible on light.
       #F4F3ED warm off-white, #202522 charcoal, #C9F27B lime. -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- back bubble: charcoal, off-white bars -->
    <g fill="none" stroke="#F4F3ED" stroke-width="7">
      <path d="M18 24H62a12 12 0 0 1 12 12v16a12 12 0 0 1-12 12H18a12 12 0 0 1-12-12V36a12 12 0 0 1 12-12Z"/>
      <path d="M18 59 42 62 13 76Z"/>
    </g>
    <g fill="#202522">
      <path d="M18 24H62a12 12 0 0 1 12 12v16a12 12 0 0 1-12 12H18a12 12 0 0 1-12-12V36a12 12 0 0 1 12-12Z"/>
      <path d="M18 59 42 62 13 76Z"/>
    </g>
    <g fill="#F4F3ED">
      <path d="M24 37H62a3 3 0 0 1 0 6H24a3 3 0 0 1 0-6Z"/>
      <path d="M24 49H42a3 3 0 0 1 0 6H24a3 3 0 0 1 0-6Z"/>
    </g>
    <!-- front bubble: off-white face, charcoal outline, charcoal bars -->
    <g fill="none" stroke="#F4F3ED" stroke-width="15">
      <path d="M52 56H96a12 12 0 0 1 12 12v16a12 12 0 0 1-12 12H52a12 12 0 0 1-12-12V68a12 12 0 0 1 12-12Z"/>
      <path d="M52 91 76 94 47 108Z"/>
    </g>
    <g fill="#F4F3ED" stroke="#202522" stroke-width="8">
      <path d="M52 56H96a12 12 0 0 1 12 12v16a12 12 0 0 1-12 12H52a12 12 0 0 1-12-12V68a12 12 0 0 1 12-12Z"/>
      <path d="M52 91 76 94 47 108Z"/>
    </g>
    <g fill="#F4F3ED">
      <path d="M52 56H96a12 12 0 0 1 12 12v16a12 12 0 0 1-12 12H52a12 12 0 0 1-12-12V68a12 12 0 0 1 12-12Z"/>
      <path d="M52 91 76 94 47 108Z"/>
    </g>
    <g fill="#202522">
      <path d="M58 67H96a3 3 0 0 1 0 6H58a3 3 0 0 1 0-6Z"/>
      <path d="M58 77H76a3 3 0 0 1 0 6H58a3 3 0 0 1 0-6Z"/>
    </g>
  </g>
  <g fill="#C9F27B">
    <path d="M98 3q4.18 14.82 19 19-14.82 4.18-19 19-4.18-14.82-19-19 14.82-4.18 19-19Z"/>
    <path d="M114 37q1.98 7.02 9 9-7.02 1.98-9 9-1.98-7.02-9-9 7.02-1.98 9-9Z"/>
  </g></symbol>
    <!-- chat-cleanup-logo:end -->
    <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></symbol>
    <symbol id="arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="up" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></symbol>
    <symbol id="reset" viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 1 7M4 4v6h6"/></symbol>
    <symbol id="lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 4v3"/></symbol>
    <symbol id="pin" viewBox="0 0 24 24"><path d="m9 3 6 0-1 7 4 4v2H6v-2l4-4Zm3 13v6"/></symbol>
    <symbol id="chat" viewBox="0 0 24 24"><path d="M20 11.5a8 8 0 0 1-8 8H4l1.6-4A8 8 0 1 1 20 11.5Z"/></symbol>
    <symbol id="archive" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v12h14V8m-10 4h6"/></symbol>
    <symbol id="trash" viewBox="0 0 24 24"><path d="M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7"/></symbol>
    <symbol id="check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="chrome" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.6"/><path d="M12 8.4h8M8.9 13.8 5 7m8.8 8.1L10 21"/></symbol>
  </svg>

  <div class="workspace">
    <aside class="sidebar" id="sidebar" aria-label="Demo chat history">
      <a class="brand" href="#" id="brand-home" aria-label="Chat Cleanup home">
        <svg class="brand-mark" width="34" height="34" aria-hidden="true"><use href="#chat-cleanup-logo"/></svg>
        <span>Chat Cleanup</span>
      </a>
      <button class="new-chat" id="new-chat"><svg><use href="#plus"/></svg>New chat</button>
      <label class="search"><svg><use href="#search"/></svg><input id="history-search" type="search" placeholder="Search" aria-label="Search demo chats" autocomplete="off"></label>
      <div class="history-topline"><span>Chats</span><span id="history-count" class="count-pill">30</span></div>
      <div class="history" id="history"></div>
      <div class="sidebar-bottom">
        <div class="profile"><span class="avatar">Y</span><span>You</span></div>
      </div>
    </aside>
    <button class="sidebar-scrim" id="sidebar-scrim" aria-label="Close history" hidden></button>

    <main class="main">
      <header class="topbar">
        <button class="icon-button mobile-menu" id="mobile-menu" aria-label="Open chat history" aria-controls="sidebar" aria-expanded="false"><svg><use href="#menu"/></svg></button>
        <div class="workspace-name"><span class="workspace-label">Your workspace</span><span class="mobile-brand"><svg class="brand-logo" width="24" height="24" aria-hidden="true"><use href="#chat-cleanup-logo"/></svg>Chat Cleanup</span></div>
        <nav aria-label="Page navigation"><button class="top-cta" id="get-button"><svg><use href="#chrome"/></svg>Get Chat Cleanup<svg class="small-arrow"><use href="#arrow"/></svg></button></nav>
      </header>

      <section class="stage" id="stage" aria-label="Interactive Chat Cleanup preview">
        <div class="intro" id="intro">
          <h1>A little less history.<br>A lot more <span>headspace.</span></h1>
          <p class="hero-copy">Try Chat Cleanup on this history.</p>
        </div>

        <div class="clean-view" id="clean-view" hidden>
          <div class="clean-symbol"><svg class="brand-logo" width="64" height="64" aria-hidden="true"><use href="#chat-cleanup-logo"/></svg><span class="orbit orbit-one"></span><span class="orbit orbit-two"></span></div>
          <h1>Room for your<br><span>next great idea.</span></h1>
          <p class="hero-copy" id="clean-description"></p>
          <button class="finish-cta" id="finish-get"><svg><use href="#chrome"/></svg>Get Chat Cleanup<svg><use href="#arrow"/></svg></button>
          <button class="replay-text" id="hero-replay"><svg><use href="#reset"/></svg>Reset demo</button>
        </div>

        <div class="chat-view" id="chat-view" hidden><button class="quiet-button back-home" id="back-home">← Back to the demo</button><h2 id="chat-title"></h2><div class="prompt-message"><span class="mini-avatar">Y</span><p id="chat-prompt"></p></div><div class="assistant-message"><p id="chat-answer"></p></div></div>
      </section>

      <footer class="composer-area">
        <form class="composer" id="composer"><label class="sr-only" for="demo-prompt">Add a fictional chat to this demo</label><input id="demo-prompt" placeholder="Message this demo" maxlength="100" autocomplete="off"><button type="submit" aria-label="Add a demo chat"><svg><use href="#up"/></svg></button></form>
        <div class="composer-caption"><span>Demo chats only.</span><button id="reset-button"><svg><use href="#reset"/></svg>Reset demo</button></div>
      </footer>

    </main>
  </div>

  <dialog id="info-dialog" class="modal">
    <form method="dialog">
      <button class="icon-button modal-close" value="close" aria-label="Close"><svg><use href="#close"/></svg></button>
      <h2>Coming to Chrome.</h2>
      <p>Chat Cleanup is in development.</p>
      <button class="finish-cta" value="close">Back to demo</button>
    </form>
  </dialog>
</body>
</html>
